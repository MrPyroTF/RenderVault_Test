<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | Render Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modulos.css">
    <script src="../js/admin-guard.js"></script>
</head>
<body>
    <!-- Barra Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3" style="background-color: #080a0f; border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
        <div class="container-fluid px-3">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-3" href="index.html">
                <div class="brand-logo">RV</div>
                <div class="d-flex flex-column">
                    <span style="font-size: 1.1rem; letter-spacing: 0.5px; color: #f8fafc;">Render Vault</span>
                    <span style="font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Módulo de Usuarios</span>
                </div>
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-outline-light btn-sm px-3 rounded-pill" href="index.html">← Volver al Dashboard</a>
                <button class="btn btn-outline-danger btn-sm px-3 rounded-pill" onclick="cerrarSesion()">Cerrar sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container-fluid px-5 py-4">
        <div id="mensaje" class="alert d-none shadow-sm mb-4" role="alert"></div>

        <!-- Tarjeta Contenedora del Módulo -->
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-body p-4 p-md-5">

                <!-- Encabezado de la Sección y Botón Nuevo -->
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4 pb-3 border-bottom border-secondary border-opacity-10">
                    <div>
                        <h1 class="h3 fw-bold text-white mb-1">Lista de Usuarios</h1>
                        <p class="text-secondary mb-0 small">Control de compradores y vendedores registrados en el sistema.</p>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <button id="btnRecargar" class="btn btn-outline-secondary btn-sm px-3">Recargar</button>
                        <button class="btn btn-primary btn-sm px-4 fw-semibold shadow-sm" onclick="abrirModalNuevo()" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none;">
                            + Nuevo Usuario
                        </button>
                    </div>
                </div>

                <!-- Barra de Búsqueda -->
                <div class="input-group mb-4" style="max-width: 400px;">
                    <span class="input-group-text bg-dark text-secondary border-secondary">Buscar</span>
                    <input id="txtFiltro" type="search" class="form-control bg-dark text-light border-secondary" placeholder="Nombre o correo del usuario...">
                </div>

                <!-- Tabla de Datos -->
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="py-3">Nombre</th>
                                <th class="py-3">Usuario</th>
                                <th class="py-3">Correo</th>
                                <th class="py-3">Tipo</th>
                                <th class="py-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios"></tbody>
                    </table>
                </div>

                <div id="sinResultados" class="text-center text-secondary py-5 d-none">
                    No se encontraron usuarios registrados.
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Dinámico para Crear / Editar -->
    <div class="modal fade" id="modalRegistro" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content text-light" style="background-color: #121622; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 25px 50px rgba(0,0,0,0.8);">

                <div class="modal-header border-bottom border-secondary border-opacity-25 px-4 py-3">
                    <h5 class="modal-title fw-bold text-white" id="tituloModal">Nuevo Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-4">
                    <form id="formUsuario" class="row g-3 needs-validation" novalidate>
                        <input type="hidden" id="usuarioId" value="0">

                        <div class="col-md-6">
                            <label for="nombreCompleto" class="form-label text-secondary small text-uppercase fw-semibold">Nombre completo</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombreCompleto" required maxlength="150">
                        </div>

                        <div class="col-md-6">
                            <label for="nombreUsuario" class="form-label text-secondary small text-uppercase fw-semibold">Nombre de usuario</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombreUsuario" required maxlength="50">
                        </div>

                        <div class="col-md-6">
                            <label for="correo" class="form-label text-secondary small text-uppercase fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="correo" required maxlength="100">
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label text-secondary small text-uppercase fw-semibold">Teléfono</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="telefono" required maxlength="20">
                        </div>

                        <div class="col-md-6">
                            <label for="contrasena" class="form-label text-secondary small text-uppercase fw-semibold">Contraseña</label>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="contrasena" required maxlength="255" placeholder="••••••••">
                        </div>

                        <div class="col-md-6">
                            <label for="tipoUsuario" class="form-label text-secondary small text-uppercase fw-semibold">Tipo de usuario</label>
                            <select class="form-select bg-dark text-light border-secondary" id="tipoUsuario" required>
                                <option value="Comprador">Comprador</option>
                                <option value="Vendedor">Vendedor</option>
                            </select>
                        </div>
                    </form>
                </div>

                <div class="modal-footer border-top border-secondary border-opacity-25 px-4 py-3">
                    <button type="button" class="btn btn-outline-light btn-sm px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardar" class="btn btn-primary btn-sm px-4 fw-semibold" onclick="guardarUsuario()" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none;">Guardar</button>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>protegerPagina();</script>
    <script src="js/config.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
